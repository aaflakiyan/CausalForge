<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 405" role="img" aria-label="Animated schematic replay of measured MuJoCo pushing trajectories with lower and higher friction">
<rect width="980" height="405" rx="18" fill="#111827"/>
<text x="40" y="48" fill="#f9fafb" font-family="Arial" font-weight="bold" font-size="27">Tabletop push • trajectory replay</text>
<text x="40" y="74" fill="#9ca3af" font-family="Arial" font-size="15">Animated positions interpolated from recorded MuJoCo trajectory samples (schematic, not a camera capture)</text>
<g transform="translate(30 100)"><rect x="0" y="0" width="445" height="258" rx="13" fill="#1f2937"/><text x="22" y="34" fill="white" font-size="19" font-family="Arial">Low friction • μ=0.2</text><path d="M15 192 H431" stroke="#64748b" stroke-width="7"/><rect y="152" width="30" height="39" rx="4" fill="#60a5fa"><animate attributeName="x" dur="4s" repeatCount="indefinite" calcMode="linear" values="25.0;35.9;68.1;108.7;143.1;182.2;227.7;260.3;257.5;257.5;257.5" keyTimes="0.000;0.100;0.200;0.300;0.400;0.500;0.600;0.700;0.800;0.900;1.000"/></rect><rect y="145" width="40" height="45" rx="4" fill="#fb923c"><animate attributeName="x" dur="4s" repeatCount="indefinite" calcMode="linear" values="62.2;62.2;62.2;79.9;115.2;154.0;200.1;248.5;278.3;294.7;300.6" keyTimes="0.000;0.100;0.200;0.300;0.400;0.500;0.600;0.700;0.800;0.900;1.000"/></rect><text x="20" y="237" fill="#d1d5db" font-family="Arial" font-size="14">blue = pusher    orange = payload</text></g>
<g transform="translate(505 100)"><rect x="0" y="0" width="445" height="258" rx="13" fill="#1f2937"/><text x="22" y="34" fill="white" font-size="19" font-family="Arial">High friction • μ=1.2</text><path d="M15 192 H431" stroke="#64748b" stroke-width="7"/><rect y="152" width="30" height="39" rx="4" fill="#60a5fa"><animate attributeName="x" dur="4s" repeatCount="indefinite" calcMode="linear" values="25.0;35.9;68.1;102.2;115.2;127.3;140.3;154.6;170.7;185.0;200.5" keyTimes="0.000;0.100;0.200;0.300;0.400;0.500;0.600;0.700;0.800;0.900;1.000"/></rect><rect y="145" width="40" height="45" rx="4" fill="#fb923c"><animate attributeName="x" dur="4s" repeatCount="indefinite" calcMode="linear" values="62.2;62.2;62.2;73.4;87.3;99.4;112.1;126.7;142.8;157.1;172.6" keyTimes="0.000;0.100;0.200;0.300;0.400;0.500;0.600;0.700;0.800;0.900;1.000"/></rect><text x="20" y="237" fill="#d1d5db" font-family="Arial" font-size="14">blue = pusher    orange = payload</text></g>
<text x="40" y="389" fill="#9ca3af" font-family="Arial" font-size="12">Animation repeats from the initial state. Use the charts below for quantitative comparisons.</text></svg>