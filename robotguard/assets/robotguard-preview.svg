<text x="54" y="116" fill="#edf5ff" font-family="Arial,sans-serif" font-size="38" font-weight="bold">What happens when an agent proposes a bad move?</text>
<text x="54" y="149" fill="#a9b6cc" font-family="Arial,sans-serif" font-size="20">DemoArm-3  ·  5 actions  ·  joint-space audit</text>
