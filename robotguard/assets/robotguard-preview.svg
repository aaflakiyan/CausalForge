<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">RobotGuard preflight example</title><desc id="desc">An example trajectory plot with failures at 0.2 and 0.3 seconds. Report shows six violations.</desc>
