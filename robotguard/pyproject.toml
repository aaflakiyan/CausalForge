[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotguard-preflight"
version = "0.1.0"
description = "Pre-flight checks for AI-generated robot actions: units, limits, velocity, acceleration, and timing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali Aflakian"}]
keywords = ["robotics", "physical-ai", "robot-safety", "vla", "agent-skills", "simulation"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.scripts]
robotguard = "robotguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
