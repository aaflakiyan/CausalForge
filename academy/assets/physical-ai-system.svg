</g><g transform="translate(229,80)"><rect width="186" height="85" rx="12" fill="#eaf4fb" stroke="#c9dfef"/><text x="16" y="33" font-size="19" font-weight="bold" fill="#27658a">02 · Sense</text><text x="16" y="59" font-size="14" fill="#395468">Observe state</text></g>
