[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-academy-lab"
version = "0.1.0"
description = "The first reproducible Physical AI teaching lab: MuJoCo reaching + interactive browser"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "mujoco-core==4.0.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
physical-ai-lab = "physical_ai_lab.cli:main"

[tool.setuptools.packages.find]
include = ["physical_ai_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
