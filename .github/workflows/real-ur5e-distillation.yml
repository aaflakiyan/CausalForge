name: Real MuJoCo teacher-student training
on:
  push:
    branches: [main, feature/universal-teacher-distillation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ur5e-student:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mujoco]'
      - name: Download pinned official UR5e model
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie fetch --depth 1 origin 98a70c569c4c1b6da467a20012f766ee1f8dc521
          git -C third_party/mujoco_menagerie checkout FETCH_HEAD
          git -C third_party/mujoco_menagerie sparse-checkout set universal_robots_ur5e
      - name: Physical multi-teacher training and heldout execution
        env:
          CAUSALFORGE_MENAGERIE: ${{ github.workspace }}/third_party/mujoco_menagerie
        run: |
          python -m unittest discover -s tests -p 'test_ur5e_teacher_student.py' -v
          python -m vla_council.causalforge.ur5e_teacher_student --menagerie "$CAUSALFORGE_MENAGERIE" --train 10 --test 4 --out runs/real-ur5e-distillation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-mujoco-distillation
          path: runs/real-ur5e-distillation/
