name: RobotGuard MuJoCo physics replay
on:
  push:
    paths:
      - 'robotguard/**'
      - '.github/workflows/robotguard-mujoco.yml'
  pull_request:
    paths:
      - 'robotguard/**'
      - '.github/workflows/robotguard-mujoco.yml'
  workflow_dispatch:
jobs:
  real-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install RobotGuard and actual MuJoCo physics engine
        run: python -m pip install -e './robotguard[mujoco]'
      - name: Run contract and real-physics tests
        run: python -m unittest discover -s robotguard/tests -v
      - name: Run packaged MuJoCo reproducibility example
        run: robotguard playground --out robotguard-ci-artifacts
      - name: Verify claims are backed by simulation output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('robotguard-ci-artifacts')
          simulated = json.loads((base / 'simulation.json').read_text())
          rejected = json.loads((base / 'rejected.json').read_text())
          assert simulated['status'] == 'SIMULATION_COMPLETED'
          assert simulated['integration_steps'] > 100
          assert simulated['preflight_status'] == 'PASS'
          assert simulated['metrics']['observed_joint_limit_violations'] == 0
          assert simulated['physical_safety_certified'] is False
          assert rejected['status'] == 'FAIL'
          assert (base / 'simulation.html').is_file()
          assert (base / 'playground.html').is_file()
          assert all('link_points_xy_m' in row for row in simulated['records'])
          assert all(len(row['link_points_xy_m']) == 3 for row in simulated['records'])
          print('MuJoCo replay and preflight-rejection reports verified')
          PY
      - name: End-to-end integration, comparison dashboard and provenance
        run: |
          robotguard showcase --out robotguard-showcase-ci
          python - <<'PYTEST'
          import json
          from pathlib import Path
          d = Path('robotguard-showcase-ci')
          summary = json.loads((d/'comparison.json').read_text())
          assert summary['physical_safety_certified'] is False
          assert summary['rejected_violations'] > 0
          assert set(summary['policies']) == {'linear', 'smoothstep'}
          assert (d/'index.html').is_file()
          assert (d/'inputs'/'linear.jsonl').is_file()
          assert (d/'inputs'/'smoothstep.jsonl').is_file()
          a = json.loads((d/'linear'/'simulation.json').read_text())
          b = json.loads((d/'smoothstep'/'simulation.json').read_text())
          assert a['model_sha256'] == b['model_sha256']
          assert a['trace_sha256'] != b['trace_sha256']
          assert a['simulated_duration_s'] == b['simulated_duration_s']
          for data in [a, b]:
              assert data['integration_steps'] > 100
              assert data['status'] == 'SIMULATION_COMPLETED'
              assert data['preflight_status'] == 'PASS'
              assert data['physical_safety_certified'] is False
              assert len(data['records']) > 5
              assert (d/'linear'/'playground.html').is_file()
          print('Verified two measured policies, common model, recorded data and auditable reports')
          PYTEST
      - name: Publish reproducible result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotguard-mujoco-reports
          path: |
            robotguard-ci-artifacts/
            robotguard-showcase-ci/
          if-no-files-found: warn
