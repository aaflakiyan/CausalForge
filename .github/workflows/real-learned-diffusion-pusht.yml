name: Authentic learned PushT comparison — ACT versus diffusion
on:
  push:
    branches: [feature/real-vla-pusht-evaluation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-pretrained-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      SDL_VIDEODRIVER: dummy
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native PushT model runtime
        run: |
          python -m pip install -e .
          python -m pip install 'lerobot[diffusion,pusht]==0.4.4'
      - name: Execute actual ACT and diffusion checkpoints on identical PushT task
        run: |
          python -m vla_council.causalforge.native_vla_benchmark \
            --model aadarshram/act_pusht \
            --model DanqingZ/diffusion_pusht \
            --episodes 1 --seed 42 --timeout 650 \
            --out runs/act-diffusion-pusht
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-act-diffusion-pusht
          path: runs/act-diffusion-pusht/
          retention-days: 14
