name: MuJoCo multi-seed student verification
on:
  push:
    branches: [main, feature/mujoco-robustness-audit]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mujoco]'
      - name: Obtain pinned actual robot models
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie fetch --depth 1 origin 98a70c569c4c1b6da467a20012f766ee1f8dc521
          git -C third_party/mujoco_menagerie checkout FETCH_HEAD
          git -C third_party/mujoco_menagerie sparse-checkout set universal_robots_ur5e
          git -C third_party/mujoco_menagerie rev-parse HEAD > robot-model-revision.txt
      - name: Check seed-block statistics and no evidence corruption
        run: |
          python -m unittest discover -s tests -p 'test_crossseed_audit.py' -v
          python -m unittest discover -s tests -p 'test_universal_teacher.py' -v
      - name: Execute actual teacher/student physics on independent seeds
        run: |
          python -m vla_council.causalforge.crossseed_audit --menagerie third_party/mujoco_menagerie --out runs/crossseed --seeds 41 42 43 --train 8 --test 4
          python -c 'import json; r=json.load(open("runs/crossseed/aggregate-report.json")); assert r["total_held_out_goals"]==12 and len(r["per_seed"])==3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-seed-physical-student-validation
          path: |
            runs/crossseed/
            robot-model-revision.txt
