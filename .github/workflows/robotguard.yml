name: RobotGuard checks
on:
  push:
    paths:
      - 'robotguard/**'
      - '.github/workflows/robotguard.yml'
  pull_request:
    paths:
      - 'robotguard/**'
      - '.github/workflows/robotguard.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ./robotguard
      - run: cd robotguard && python -m unittest discover -s tests -v
      - run: robotguard check robotguard/examples/safe.jsonl --spec robotguard/examples/robot.json --json /tmp/safe.json --html /tmp/safe.html
      - name: Check deliberately unsafe trace fails
        run: |
          if robotguard check robotguard/examples/unsafe.jsonl --spec robotguard/examples/robot.json; then
            echo 'Unsafe trace unexpectedly passed' >&2
            exit 1
          fi
