name: Audit dual UR5e workspace
on:
  push:
    branches: [fix/dual-ur5e-meaningful-task]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mujoco]'
      - run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie sparse-checkout set universal_robots_ur5e
      - run: python -m vla_council.causalforge.dual_ur5e_audit --menagerie third_party/mujoco_menagerie
      - name: Validate workspace-reach geometry and tracking
        env:
          CAUSALFORGE_MENAGERIE: ${{ github.workspace }}/third_party/mujoco_menagerie
        run: |
          python -m unittest discover -s tests -p 'test_dual_ur5e_reach.py' -v
          python -m vla_council.causalforge.dual_ur5e_reach --menagerie "$CAUSALFORGE_MENAGERIE" --out runs/dual-ur5e-reach.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-ur5e-reach-validation
          path: runs/*.json
