name: Validated CausalForge policy API
on:
  push:
    branches: [main, feature/validated-policy-api]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mujoco]'
      - name: Fetch pinned real UR5e models
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie fetch --depth 1 origin 98a70c569c4c1b6da467a20012f766ee1f8dc521
          git -C third_party/mujoco_menagerie checkout FETCH_HEAD
          git -C third_party/mujoco_menagerie sparse-checkout set universal_robots_ur5e
      - name: Fail-closed positive and negative tests
        env:
          CAUSALFORGE_MENAGERIE: ${{ github.workspace }}/third_party/mujoco_menagerie
        run: |
          python -m unittest discover -s tests -p 'test_dual_ur5e_policy.py' -v
          python -m unittest discover -s tests -p 'test_quickstart.py' -v
      - name: Run actual installed CLI and record measured task results
        run: |
          causalforge demo --menagerie third_party/mujoco_menagerie --trace --out runs/validated-quickstart
          python -c 'import json; d=json.load(open("runs/validated-quickstart/metrics.json")); assert d["task_success"]; assert len(d["trace"])==150; assert d["physics_substeps_per_action"]==5'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-dual-ur5e-policy
          path: runs/validated-quickstart/
