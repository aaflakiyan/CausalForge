name: VLA camera observation in MuJoCo
on:
  push:
    branches: [main, feature/vla-camera-observation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rgb-vla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 libosmesa6-dev
          pip install -e '.[mujoco]'
      - name: Obtain pinned UR5e meshes
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie fetch --depth 1 origin 98a70c569c4c1b6da467a20012f766ee1f8dc521
          git -C third_party/mujoco_menagerie checkout FETCH_HEAD
          git -C third_party/mujoco_menagerie sparse-checkout set universal_robots_ur5e
      - name: Validate actual rendered RGB observations and dual UR5e task
        env:
          CAUSALFORGE_MENAGERIE: ${{ github.workspace }}/third_party/mujoco_menagerie
        run: python -m unittest discover -s tests -p 'test_vla_camera.py' -v
