name: Physical AI Academy Lab 01
on:
  push:
    paths: ['academy/**', '.github/workflows/physical-ai-academy.yml']
  pull_request:
    paths: ['academy/**', '.github/workflows/physical-ai-academy.yml']
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test real MuJoCo physics
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Run benchmark
        run: physical-ai-lab --out results/benchmark.json --steps 1200
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: academy/results/benchmark.json
