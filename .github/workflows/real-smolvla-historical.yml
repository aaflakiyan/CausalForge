name: SmolVLA historical checkpoint compatibility — LeRobot 0.3.3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      SDL_VIDEODRIVER: dummy
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install historical model runtime
        run: |
          python -m pip install -e .
          python -m pip install 'lerobot[smolvla,pusht]==0.3.3'
      - name: Try original actual SmolVLA weights in matching historical runtime
        run: |
          python -m vla_council.causalforge.native_vla_benchmark \
            --model n3puiol/smolvla_pusht \
            --model aadarshram/act_pusht \
            --episodes 1 --seed 42 --timeout 650 \
            --out runs/historical-smolvla
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-smolvla-historical-runtime
          path: runs/historical-smolvla/
          retention-days: 14
