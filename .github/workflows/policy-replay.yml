name: Recorded policy MuJoCo replay

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/vla_council/causalforge/rollout_actions.py'
      - 'examples/pusher_policy_chunk.json'
      - '.github/workflows/policy-replay.yml'
  pull_request:
    paths:
      - 'src/vla_council/causalforge/rollout_actions.py'
      - 'examples/pusher_policy_chunk.json'
      - '.github/workflows/policy-replay.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mujoco]'
      - run: python -m unittest discover -s tests -p 'test_rollout_actions.py' -v
      - name: Replay example policy commands
        run: python -m vla_council.causalforge.rollout_actions examples/pusher_policy_chunk.json --out runs/policy-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-replay-trajectory
          path: runs/policy-replay.json
          if-no-files-found: error
